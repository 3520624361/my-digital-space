<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Solara</title>
    <meta name="apple-mobile-web-app-title" content="Solara">
    <link rel="icon" type="image/svg+xml" href="/solara/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/solara/favicon.png">
    <link rel="shortcut icon" href="/solara/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/solara/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/solara/css/style.css">
    <script src="/solara/js/i18n.js"></script>
    <script>
        (function () {
            const ua = navigator.userAgent || "";
            const isMobileUA = /android|iphone|ipad|ipod|mobile|blackberry|phone|opera mini|windows phone/i.test(ua);
            const isSmallScreen = typeof window.matchMedia === "function" && window.matchMedia("(max-width: 820px)").matches;
            const isMobile = isMobileUA || isSmallScreen;
            window.__SOLARA_IS_MOBILE = isMobile;
            if (!isMobile) {
                document.documentElement.classList.add("desktop-view");
                const desktopLink = document.createElement("link");
                desktopLink.rel = "stylesheet";
                desktopLink.href = "/solara/css/desktop.css";
                desktopLink.id = "desktopStylesheet";
                document.head.appendChild(desktopLink);
                return;
            }
            document.documentElement.classList.add("mobile-view");
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = "/solara/css/mobile.css";
            link.id = "mobileStylesheet";
            document.head.appendChild(link);
            const setViewportUnit = () => {
                const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                document.documentElement.style.setProperty("--mobile-vh", `${viewportHeight}px`);
            };
            const applyBodyClass = () => {
                if (document.body) {
                    document.body.classList.add("mobile-view");
                    setViewportUnit();
                }
            };
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", applyBodyClass, { once: true });
            } else {
                applyBodyClass();
            }
            window.addEventListener("resize", setViewportUnit);
            window.addEventListener("orientationchange", setViewportUnit);
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", setViewportUnit);
            }
            setViewportUnit();
        })();
    </script>
    <style id="safari-ios-26-fix">
        html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; box-sizing: border-box; }
        .login-shell { position: relative; left: 50%; transform: translateX(-50%); margin-inline: auto; }
        body { padding-left: max(env(safe-area-inset-left), 16px); padding-right: max(env(safe-area-inset-right), 16px); }
        @supports (height: 100dvh) { :root { --mobile-vh: 100dvh; } }
    </style>
</head>
<body>
    <div class="background-stage" id="backgroundStage">
        <div class="background-stage__layer background-stage__layer--base" id="backgroundBaseLayer"></div>
        <div class="background-stage__layer background-stage__layer--transition" id="backgroundTransitionLayer"></div>
    </div>
    <div class="container" id="mainContainer">
        <!-- Mobile Toolbar -->
        <div class="mobile-toolbar" id="mobileToolbar" role="toolbar">
            <button class="mobile-toolbar__button" id="mobileExploreButton" type="button">
                <i class="fas fa-satellite-dish"></i>
            </button>
            <div class="mobile-toolbar__title" id="mobileToolbarTitle">Solara</div>
            <div class="mobile-toolbar__actions">
                <button class="mobile-toolbar__button" id="mobileSearchToggle" type="button">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <h1>Solara</h1>
            <div class="warning">Made by Wet Dream Boy，免费API来自GD音乐台，仅供学习交流使用</div>
            <div class="header-left-controls">
                <button id="themeToggleButton" class="theme-toggle-button" type="button">
                    <i class="fas fa-sun theme-icon theme-icon--sun"></i>
                    <i class="fas fa-moon theme-icon theme-icon--moon"></i>
                </button>
            </div>
            <div class="theme-switch-wrapper">
                <button id="openSettingsBtn" class="theme-toggle-button" type="button" title="设置（或双击Logo）">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>

        <!-- Search Area -->
        <div class="search-area" id="searchArea">
            <div class="search-header">
                <h2 class="search-title">探索音乐</h2>
                <button type="button" class="mobile-close-btn" id="mobileSearchClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="search-controls-wrapper">
                <div class="search-bar-unified">
                    <div class="search-input-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="搜索歌曲、歌手或专辑...">
                    </div>
                    <div class="source-select-wrapper" id="sourceSelectWrapper">
                        <button id="sourceSelectButton" class="source-select-btn" type="button">
                            <span id="sourceSelectLabel">网易云</span>
                            <i class="fas fa-chevron-down caret-icon"></i>
                        </button>
                        <div id="sourceMenu" class="source-menu" role="listbox"></div>
                    </div>
                </div>
                <button id="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i> <span>搜索</span>
                </button>
            </div>
            <div id="searchResults" class="search-results">
                <div id="searchResultsList" class="search-results-list"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="cover-area">
                <div class="mobile-turntable" id="mobileTurntable">
                    <div class="mobile-turntable__platter">
                        <div class="album-cover" id="albumCover">
                            <div class="placeholder"><i class="fas fa-music"></i></div>
                        </div>
                    </div>
                </div>
                <div class="mobile-inline-lyrics" id="mobileInlineLyrics">
                    <div class="mobile-inline-lyrics__hint"><i class="fas fa-arrow-left"></i> 轻触返回封面</div>
                    <div class="mobile-inline-lyrics__scroll" id="mobileInlineLyricsScroll">
                        <div class="mobile-inline-lyrics__content" id="mobileInlineLyricsContent"></div>
                    </div>
                </div>
                <div class="current-song-info">
                    <div class="current-song-title-row">
                        <span class="current-song-title" id="currentSongTitle">选择一首歌曲开始播放</span>
                        <button class="favorite-toggle current-favorite-btn" id="currentFavoriteToggle" type="button">
                            <i class="far fa-heart"></i>
                        </button>
                    </div>
                    <div class="current-song-artist" id="currentSongArtist">未知艺术家</div>
                    <button class="mobile-quality-chip" id="mobileQualityToggle" type="button">
                        <span id="mobileQualityLabel">极高音质</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
            </div>

            <div class="mobile-panel" id="mobilePanel">
                <div class="mobile-panel-header" id="mobilePanelHeader">
                    <div class="mobile-panel-handle"></div>
                    <div class="playlist-tabs" role="tablist">
                        <button id="mobilePlaylistTab" class="playlist-tab active" type="button" data-target="playlist">播放列表</button>
                        <button id="mobileFavoritesTab" class="playlist-tab" type="button" data-target="favorites">收藏列表</button>
                    </div>
                    <div class="mobile-panel-actions">
                        <div class="mobile-actions-group" id="mobilePlaylistActions">
                            <button id="mobileImportPlaylistBtn" class="mobile-panel-action-btn" type="button"><i class="fas fa-file-import"></i></button>
                            <button id="mobileExportPlaylistBtn" class="mobile-panel-action-btn" type="button" disabled><i class="fas fa-file-export"></i></button>
                            <button id="mobileClearPlaylistBtn" class="mobile-panel-action-btn mobile-panel-clear-btn" type="button" hidden><i class="fas fa-trash"></i></button>
                        </div>
                        <div class="mobile-actions-group" id="mobileFavoritesActions" hidden>
                            <button id="mobileAddAllFavoritesBtn" class="mobile-panel-action-btn" type="button"><i class="fas fa-plus-circle"></i></button>
                            <button id="mobileImportFavoritesBtn" class="mobile-panel-action-btn" type="button"><i class="fas fa-file-import"></i></button>
                            <button id="mobileExportFavoritesBtn" class="mobile-panel-action-btn" type="button" disabled><i class="fas fa-file-export"></i></button>
                            <button id="mobileClearFavoritesBtn" class="mobile-panel-action-btn" type="button"><i class="fas fa-trash"></i></button>
                        </div>
                        <button id="mobilePanelClose" class="mobile-close-btn mobile-panel-action-btn" type="button"><i class="fas fa-chevron-down"></i></button>
                    </div>
                </div>

                <!-- Playlist -->
                <div class="playlist active empty" id="playlist" role="tabpanel">
                    <div class="playlist-header">
                        <div class="playlist-tabs" role="tablist">
                            <button id="playlistTab" class="playlist-tab active" type="button" data-target="playlist">播放列表</button>
                            <button id="favoritesTab" class="playlist-tab" type="button" data-target="favorites">收藏列表</button>
                        </div>
                        <div class="playlist-actions-tray">
                            <input id="importPlaylistInput" type="file" accept="application/json" hidden>
                            <button class="playlist-action-btn playlist-action-btn--import" id="importPlaylistBtn" type="button"><i class="fas fa-file-import"></i></button>
                            <button class="playlist-action-btn playlist-action-btn--export" id="exportPlaylistBtn" type="button"><i class="fas fa-file-export"></i></button>
                            <button class="playlist-action-btn playlist-action-btn--clear" id="clearPlaylistBtn" type="button"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="playlist-scroll"><div class="playlist-items" id="playlistItems"></div></div>
                </div>

                <!-- Favorites -->
                <div class="playlist favorites empty" id="favorites" role="tabpanel" hidden>
                    <div class="playlist-header">
                        <div class="playlist-tabs" role="tablist">
                            <button id="playlistTabSecondary" class="playlist-tab active" type="button" data-target="playlist">播放列表</button>
                            <button id="favoritesTabSecondary" class="playlist-tab" type="button" data-target="favorites">收藏列表</button>
                        </div>
                        <div class="playlist-actions-tray">
                            <button class="playlist-action-btn" id="addAllFavoritesBtn" type="button"><i class="fas fa-plus-circle"></i></button>
                            <input id="importFavoritesInput" type="file" accept="application/json" hidden>
                            <button class="playlist-action-btn" id="importFavoritesBtn" type="button"><i class="fas fa-file-import"></i></button>
                            <button class="playlist-action-btn" id="exportFavoritesBtn" type="button"><i class="fas fa-file-export"></i></button>
                            <button class="playlist-action-btn playlist-action-btn--clear" id="clearFavoritesBtn" type="button"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="playlist-scroll"><div class="playlist-items" id="favoriteItems"></div></div>
                </div>

                <!-- Lyrics -->
                <div class="lyrics empty" id="lyrics" data-placeholder="default">
                    <div class="lyrics-scroll" id="lyricsScroll">
                        <div class="lyrics-content" id="lyricsContent"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="transport-controls">
                <button class="play-mode-btn transport-button transport-button--mode" id="playModeBtn" type="button"><i class="fas fa-repeat"></i></button>
                <button class="transport-button transport-button--prev" onclick="playPrevious()" type="button"><i class="fas fa-backward-step"></i></button>
                <button class="transport-button transport-button--play" id="playPauseBtn" type="button"><i class="fas fa-play"></i></button>
                <button class="transport-button transport-button--next" onclick="playNext()" type="button"><i class="fas fa-forward-step"></i></button>
                <button class="transport-button transport-button--queue" id="mobileQueueToggle" type="button"><i class="fas fa-bars"></i></button>
                <button class="transport-button transport-button--shuffle" id="shuffleToggleBtn" type="button"><i class="fas fa-shuffle shuffle-icon shuffle-icon--off"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTimeDisplay">00:00</span>
                <input type="range" id="progressBar" min="0" max="0" step="0.1" value="0">
                <span id="durationDisplay">00:00</span>
            </div>
            <div class="control-trailing">
                <div class="audio-tools">
                    <div class="player-quality">
                        <button id="qualityToggle" class="player-quality-btn" type="button"><span id="qualityLabel">极高音质</span></button>
                        <div id="playerQualityMenu" class="player-quality-menu"></div>
                    </div>
                    <div class="volume-container">
                        <i id="volumeIcon" class="fas fa-volume-up"></i>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                    </div>
                </div>
                <button id="loadOnlineBtn" type="button">
                    <span class="btn-text"><i class="fas fa-satellite-dish"></i> 探索雷达</span>
                    <span class="loader" style="display:none"></span>
                </button>
            </div>
        </div>
    </div>

    <div class="mobile-overlay-scrim" id="mobileOverlayScrim"></div>
    <audio id="audioPlayer" preload="metadata" playsinline></audio>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content settings-content">
            <div class="modal-header">
                <h2>设置</h2>
                <button id="closeSettingsBtn" class="close-modal-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <section class="settings-section">
                    <h3>探索雷达风格</h3>
                    <p class="settings-hint">选择您喜欢的音乐风格，探索雷达将从中为您推荐歌曲。</p>
                    <div id="radarGenreList" class="genre-grid"></div>
                </section>
            </div>
            <div class="modal-footer">
                <button id="saveSettingsBtn" class="save-settings-btn">保存设置</button>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>
    <div id="debugInfo" class="debug-info"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- API Shim: 将 /proxy 改为 /api/proxy -->
    <script>
        // 覆盖 Solara 的 API 基础路径
        window.__SOLARA_API_BASE = '/api/proxy';
        window.__SOLARA_PALETTE_BASE = '/api/palette';
        window.__SOLARA_STORAGE_BASE = '/api/storage';
    </script>
    <script src="/solara/js/index.js"></script>
    <script>
        if (window.__SOLARA_IS_MOBILE) {
            var ms = document.createElement('script');
            ms.src = '/solara/js/mobile.js';
            ms.async = false;
            document.body.appendChild(ms);
        }
    </script>
</body>
</html>
